; 日本語化パッチの表示の設定
; （DOSBOX フォルダの opengl32.dll が読みます。メモ帳で書き換えられます）
[view]
; 日本語の字の形: shinonome（東雲フォント 12ドット）または misaki（美咲フォント 8ドット）
; ゲーム中に F11 キーを押しても切り替えられます
font=shinonome
; 窓の中の大きさ（窓のふちをドラッグして変えると、ここに書き込まれます）
width=960
height=720
; 窓の大きさを覚える: 1＝覚える、0＝覚えない
remember=1
; 縦と横の比: 1＝4:3 を保つ、0＝窓いっぱいに広げる
aspect=1
; 広げ方: linear（なめらか）または nearest（くっきり）
filter=linear
; うまく動かないとき 1 にすると、ultima_ja.log に記録します
log=0
